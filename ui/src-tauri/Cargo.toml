[package]
name = "bigscreen-novr-next"
version = "0.1.0"
description = "Bigscreen NOVR React preview frontend"
authors = ["Bigscreen NOVR community"]
edition = "2021"
[lib]
name = "bigscreen_novr_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2.0", features = [] }
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }
dirs = "5"
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
